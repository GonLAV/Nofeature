server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Harden: hide nginx version ─────────────────────────────────────────────
  server_tokens off;

  # ── Security headers (applied to every response) ──────────────────────────
  add_header X-Frame-Options              "DENY"                              always;
  add_header X-Content-Type-Options       "nosniff"                           always;
  add_header X-XSS-Protection            "1; mode=block"                     always;
  add_header Referrer-Policy             "strict-origin-when-cross-origin"   always;
  add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=()" always;
  # CSP: allow same-origin scripts/styles, inline styles (Tailwind), same-origin
  # API/SSE connections, and data: URIs for images.
  # Tighten style-src once CSS-in-JS or a nonce approach is used.
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;

  # ── Gzip ───────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml+rss
    image/svg+xml;

  # ── SPA fallback ───────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── API + SSE proxy ────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://api:4000;
    proxy_http_version 1.1;

    # Keep connection alive for WebSocket upgrades and SSE
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE / streaming: disable response buffering; raise timeouts
    proxy_buffering        off;
    proxy_cache            off;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;
    proxy_connect_timeout  10s;

    # Do not expose backend version header
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  # ── Static assets (long-lived cache) ──────────────────────────────────────
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-declare security headers — location blocks inherit but only for
    # add_header set at the same level, so we repeat the critical ones.
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-Frame-Options         "DENY"        always;
  }

  # ── Block common attack paths ──────────────────────────────────────────────
  location ~ /\. {
    deny all;
  }
}
